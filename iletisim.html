<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim — Melih Turgut</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg: #0d0d0d;
      --accent: #4ecca3;
      --accent2: #7b61ff;
      --text: #e8e8e8;
      --muted: #666;
      --border: rgba(255,255,255,0.07);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* LIGHT */
    body[data-theme="light"] {
      --bg: transparent;
      --accent: #0a9b76;
      --accent2: #5b41df;
      --text: #1a1a1a;
      --muted: #666;
      --border: rgba(0,0,0,0.15);
    }

    body[data-theme="light"] .contact-card {
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(6px);
    }

    body[data-theme="light"] nav {
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(14px);
    }

    /* BAD */
    body[data-theme="bad"] {
      --bg: #0d0033;
      --accent: #ffff00;
      --accent2: #ff00ff;
      --text: #00ff00;
      --muted: #ff6600;
      --border: rgba(255,0,255,0.4);
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive !important;
    }

    body[data-theme="bad"] .contact-card {
      border-color: #ff00ff;
      background: rgba(255,0,255,0.07);
      animation: badWobble 2s infinite;
    }

    body[data-theme="bad"] .contact-card:nth-child(2) { animation-delay: 0.3s; }
    body[data-theme="bad"] .contact-card:nth-child(3) { animation-delay: 0.6s; }

    body[data-theme="bad"] .c-value { color: #00ff00; }
    body[data-theme="bad"] h1 {
      color: #ff00ff;
      text-shadow: 2px 2px 0 #ffff00;
      animation: badFlicker 1.5s infinite alternate;
    }

    @keyframes badWobble {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(1deg); }
      75%       { transform: rotate(-1deg); }
    }

    @keyframes badFlicker {
      0%   { text-shadow: 2px 2px 0 #ffff00; }
      100% { text-shadow: -2px -2px 0 #00ffff; }
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      text-decoration: none;
      color: var(--accent);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .nav-links { display: flex; gap: 12px; }

    .nav-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 1px;
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: color 0.2s, border-color 0.2s;
      background: none;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    #themeBtn { font-size: 1rem; padding: 6px 10px; }

    /* MAIN */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 140px 48px 80px;
    }

    .section-label {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
      margin-bottom: 18px;
    }

    .divider {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      margin-bottom: 48px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .contact-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .contact-card:hover {
      border-color: var(--accent2);
      transform: translateY(-3px);
    }

    .c-icon { font-size: 1.6rem; }
    .c-label { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .c-value {
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 500;
      text-decoration: none;
      word-break: break-all;
    }
    .c-value:hover { color: var(--accent); }

    @media (max-width: 640px) {
      nav { padding: 18px 24px; }
      main { padding: 120px 24px 60px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">MT</a>
    <div class="nav-links">
      <a href="hakkimda.html" class="nav-btn">Hakkımda</a>
      <a href="iletisim.html" class="nav-btn active">İletişim</a>
      <button id="themeBtn" class="nav-btn" title="Tema değiştir">🌙</button>
    </div>
  </nav>

  <main>
    <p class="section-label">İletişim</p>
    <h1>İletişim</h1>
    <div class="divider"></div>

    <div class="contact-grid slide-up">
      <div class="contact-card">
        <span class="c-icon">📞</span>
        <span class="c-label">Telefon</span>
        <a class="c-value" href="tel:+905385209360">+90 (538) 520 9360</a>
      </div>
      <div class="contact-card">
        <span class="c-icon">✉️</span>
        <span class="c-label">E-posta</span>
        <a class="c-value" href="mailto:melih.turgut@icloud.com">melih.turgut@icloud.com</a>
      </div>
      <div class="contact-card">
        <span class="c-icon">💼</span>
        <span class="c-label">LinkedIn</span>
        <a class="c-value" href="https://www.linkedin.com/in/melihturgut1/" target="_blank" rel="noopener">linkedin.com/in/melihturgut1</a>
      </div>
    </div>

    <!-- İletişim Formu -->
    <div class="slide-up" style="margin-top:48px;">
      <p class="section-label" style="margin-bottom:10px;">Mesaj Gönder</p>
      <!-- Formspree: formspree.io adresinden ücretsiz form oluşturup
           aşağıdaki action URL'ini kendi form ID'inizle değiştirin -->
      <form id="contactForm" class="contact-form" action="https://formspree.io/f/xqenorzj" method="POST">
        <input  type="text"  name="name"    placeholder="Adınız Soyadınız" required>
        <input  type="email" name="email"   placeholder="E-posta adresiniz" required>
        <input  type="text"  name="subject" placeholder="Konu">
        <textarea            name="message" placeholder="Mesajınız..." required></textarea>
        <button type="submit">Gönder</button>
      </form>
      <p id="formSuccess" class="form-success"></p>
    </div>

    <!-- CV İndir -->
    <div class="slide-up" style="margin-top:40px;">
      <p class="section-label" style="margin-bottom:10px;">Özgeçmiş</p>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:12px;">CV'nizi PDF olarak indirin.</p>
      <a href="cvson.pdf" download class="cv-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        CV İndir (PDF)
      </a>
    </div>
  </main>

  <canvas id="sunCanvas"     style="position:fixed;inset:0;pointer-events:none;z-index:-1;display:none;"></canvas>
  <canvas id="chaosCanvas"   style="position:fixed;inset:0;pointer-events:none;z-index:45;display:none;opacity:0.45;"></canvas>
  <canvas id="weatherCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:50;display:none;"></canvas>
  <script src="sun.js"></script>
  <script src="chaos.js"></script>
  <script src="weather.js"></script>
  <script src="theme.js"></script>
  <script src="interactions.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
