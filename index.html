<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melih Turgut</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    @import url('https://fonts.cdnfonts.com/css/pacific-northwest-letters');

    :root {
      --bg: #0d0d0d;
      --accent: #4ecca3;
      --accent2: #7b61ff;
      --text: #e8e8e8;
      --muted: #666;
      --border: rgba(255,255,255,0.07);
      --nav-bg: transparent;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    /* LIGHT MODE */
    body[data-theme="light"] {
      --bg: transparent;
      --accent: #0a9b76;
      --accent2: #5b41df;
      --text: #1a1a1a;
      --muted: #666;
      --border: rgba(0,0,0,0.15);
    }

    body[data-theme="light"] h1 {
      background: linear-gradient(135deg, #1a1a1a 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    body[data-theme="light"] .bg-glow {
      background:
        radial-gradient(ellipse 60% 50% at 60% 40%, rgba(10,155,118,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 40% 65%, rgba(91,65,223,0.06) 0%, transparent 70%);
    }

    /* BAD COLOR MODE */
    body[data-theme="bad"] {
      --bg: #0d0033;
      --accent: #ffff00;
      --accent2: #ff00ff;
      --text: #00ff00;
      --muted: #ff6600;
      --border: rgba(255,0,255,0.4);
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive !important;
    }

    body[data-theme="bad"] h1 {
      font-family: 'Comic Sans MS', cursive !important;
      background: none !important;
      -webkit-text-fill-color: unset !important;
      color: #ff00ff;
      text-shadow: 3px 3px 0 #ffff00, -2px -2px 0 #00ffff;
      animation: badFlicker 1.5s infinite alternate;
    }

    body[data-theme="bad"] .hero-tag {
      color: #ffff00;
      border-color: #ff00ff;
      background: rgba(255,0,255,0.15);
      animation: badPulse 0.8s infinite alternate;
    }

    body[data-theme="bad"] .bg-glow {
      background:
        radial-gradient(ellipse 60% 50% at 60% 40%, rgba(255,0,255,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 40% 65%, rgba(0,255,0,0.1) 0%, transparent 70%);
    }

    @keyframes badFlicker {
      0%   { text-shadow: 3px 3px 0 #ffff00, -2px -2px 0 #00ffff; }
      50%  { text-shadow: -3px 3px 0 #ff0000, 2px -2px 0 #00ff00; }
      100% { text-shadow: 3px -3px 0 #ff00ff, -2px 2px 0 #ffff00; }
    }

    @keyframes badPulse {
      from { transform: scale(1); }
      to   { transform: scale(1.05); }
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 48px;
      gap: 12px;
    }

    .nav-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 1px;
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: color 0.2s, border-color 0.2s;
      background: none;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    #themeBtn {
      font-size: 1rem;
      padding: 6px 10px;
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 60% 40%, rgba(78,204,163,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 40% 65%, rgba(123,97,255,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-tag {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(78,204,163,0.3);
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 28px;
      position: relative;
    }

    h1 {
      font-family: 'Pacific Northwest Letters', cursive;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 3px;
      padding-bottom: 0.2em;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }
  </style>
</head>
<body>

  <nav>
    <a href="hakkimda.html" class="nav-btn">Hakkımda</a>
    <a href="iletisim.html" class="nav-btn">İletişim</a>
    <button id="themeBtn" class="nav-btn" title="Tema değiştir">🌙</button>
  </nav>

  <main>
    <div class="bg-glow"></div>
    <div class="hero-tag slide-up">Hoş Geldiniz</div>
    <h1 class="slide-up">Melih Turgut</h1>
    <p id="typewriter" style="font-size:1.1rem;color:var(--muted);margin-top:12px;min-height:1.5em;position:relative;"></p>
    <a href="cvson.pdf" download class="cv-btn slide-up">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      CV İndir
    </a>
  </main>

  <canvas id="sunCanvas"     style="position:fixed;inset:0;pointer-events:none;z-index:-1;display:none;"></canvas>
  <canvas id="chaosCanvas"   style="position:fixed;inset:0;pointer-events:none;z-index:45;display:none;opacity:0.45;"></canvas>
  <canvas id="weatherCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:50;display:none;"></canvas>
  <script src="sun.js"></script>
  <script src="chaos.js"></script>
  <script src="weather.js"></script>
  <script src="theme.js"></script>
  <script src="interactions.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
